<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"> -->
    <link rel="stylesheet" href="css/fontawsome.css" />
    <link rel="stylesheet" href="css/style.css" />

  </head>
  <body>
    <!-- <div class="input_with_icon">
      <input
        class="outliner_input"
        type="text"

    <div class="login_container">
      <div class="login_card">
        <h1>ورود به پنل کاربری</h1>
        <p>آموزشگاه سرزمین دانش</p>
        <form action="#" method="post">
          <div class="input_group floating">
            <input type="text" name="username" id="username" required />
            <label for="username">username</label>
            <i class="fa fa-user input_icon"></i>
            <div class="underline"></div>
          </div>
          <div class="input_group floating">
            <input type="text" name="password" id="password" required />
            <label for="password">password</label>
            <i class="fa fa-lock input_icon"></i>
            <div class="underline"></div>
          </div>
          <div class="option">
            <label class="remember" for="savelogin">
              <input type="checkbox" name="remember" id="savelogin" />
              <span class="checkmark"></span>Save login info ...
            </label>
            <a href="#" class="forget_password">Forget Password</a>
          </div>
          <button type="submit" class="btn_login">
            <span>Login</span>
            <i class="fas fa-arrow-right"></i>
          </button>
          <div class="divider">
            <span>Or</span>
          </div>
          <div class="social_login">
            <button type="button" class="btn_social">
              <span>Login with telegram</span>
              <i class="fab fa-telegram"></i>
            </button>
            <button type="button" class="btn_social">
              <span>Login with Google</span>
              <i class="fab fa-google"></i>
            </button>
            <button type="button" class="btn_social">
              <span>Login with github</span>
              <i class="fab fa-github"></i>
            </button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
